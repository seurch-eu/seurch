# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Each ecosystem here has a lockfile committed to the repository, so an update
# that is not proposed is an update that never happens.

version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock). CI runs `uv sync --locked`,
  # so the lockfile has to move with the manifest.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      prefix-development: "build"

  # The workflows' own actions. Without this they sit on whatever major they
  # were pinned to and drift into deprecation (a runner dropping the Node
  # version an action targets eventually breaks the job, not just warns).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # The Tailwind / Font Awesome toolchain (package.json + package-lock.json).
  # The `css` job runs `npm ci`, which fails outright if the two disagree.
  # A Font Awesome bump also needs `make fonts` run and the vendored assets
  # committed, and a Tailwind bump needs `make css`; CI's `css` job catches a
  # stale stylesheet either way.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      prefix-development: "build"
