[project]
name = "seurch"
version = "0.1.2"
description = "An opensource metasearch engine"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.1.1",
    "psycopg[binary]>=3.3.4",
    "segno>=1.6.6",
    "tzdata>=2026.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.0",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore = [
    # Needed for providers call 
    "BLE001",
    # Django class bodies are declarative
    "RUF012",
]

[tool.commitizen]
name = "cz_conventional_commits"
# The version lives in [project] above; the uv provider reads and rewrites it
# there and keeps the "seurch" entry in uv.lock in step, so a bump no longer
# leaves the lockfile behind.
version_provider = "uv"
# Everything else carrying the version. Each entry is "path:regex": only lines
# matching the regex *and* containing the outgoing version are rewritten, so
# the regexes stay anchored to the root "version" keys and leave the
# dependency entries below them alone.
version_files = [
    'package.json:^  "version":',
    'package-lock.json:^ {2,6}"version":',
]
# Matches the tag pattern .github/workflows/docker.yml builds images for.
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
# Pre-1.0: a breaking change bumps the minor, never to 1.0.0.
major_version_zero = true
