{% load i18n %}
<section class="ia-card" data-ia-type="hash" data-ia-hash data-hash-url="{% url 'instant:hashes' %}">
  <div class="ia-pad">
    <div class="ia-head"><span class="ia-eyebrow">#️⃣ {% trans "Hash generator" %}</span></div>
    <input class="ia-input ia-mono" data-ia-hash-input value="{{ answer.text }}" spellcheck="false" autocomplete="off"
           style="width:100%;box-sizing:border-box;border:1.5px solid var(--border);border-radius:11px;background:var(--bg-alt);margin-bottom:.7rem;" aria-label="{% trans "Text to hash" %}">
    <div class="ia-kv">
      {% for algo, digest in answer.hashes.items %}
      <div class="ia-kv-row"{% if algo == answer.highlight %} style="background:var(--accent-soft);border-radius:9px;padding:.3rem .4rem;"{% endif %}>
        <span class="ia-kv-key">{{ algo|upper }}</span>
        <span class="ia-kv-val ia-mono" data-ia-hash-out="{{ algo }}" style="font-size:.78rem;">{{ digest }}</span>
        {% include 'instant/_copybtn.html' %}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
