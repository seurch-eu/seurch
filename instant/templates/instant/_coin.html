{% load i18n %}
<section class="ia-card" data-ia-type="coin" data-ia-coin>
  <div class="ia-pad" style="text-align:center;">
    <div class="ia-head" style="justify-content:center;"><span class="ia-eyebrow">🪙 {% trans "Coin flip" %}</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:.8rem;">
      <div class="ia-coin" data-ia-coin-face>{{ answer.result }}</div>
      <button class="ia-btn ia-btn-primary" data-ia-coin-flip>↻ {% trans "Flip again" %}</button>
    </div>
  </div>
</section>
