{% load i18n %}
<section class="ia-card" data-ia-type="password" data-ia-password>
  <div class="ia-pad">
    <div class="ia-head">
      <span class="ia-eyebrow">🔑 {% trans "Password generator" %}</span>
      <span class="ia-head-meta" data-ia-pw-strength></span>
    </div>
    <div class="ia-result">
      <span class="ia-result-value ia-mono" data-ia-pw-value style="font-size:1.1rem;">{{ answer.value }}</span>
      <button class="ia-copy" data-ia-copy-target="[data-ia-pw-value]" title="{% trans "Copy" %}" aria-label="{% trans "Copy password" %}" style="margin-left:auto;">
        <i class="fa-solid fa-copy" aria-hidden="true"></i>
      </button>
      <button class="ia-btn" data-ia-pw-regen title="{% trans "Generate new" %}">↻</button>
    </div>
    <div class="ia-pw-strength-bar" aria-hidden="true"><span data-ia-pw-meter></span></div>
    <div class="ia-row" style="margin-top:.8rem;gap:.7rem;">
      <label class="ia-label" style="margin:0;">{% trans "Length" %}</label>
      <input type="range" min="6" max="48" value="{{ answer.length }}" data-ia-pw-length style="flex:1;accent-color:var(--accent);">
      <span class="ia-mono" data-ia-pw-length-val style="width:2ch;text-align:right;">{{ answer.length }}</span>
    </div>
    <div class="ia-regex-flags" style="margin-top:.6rem;">
      <label><input type="checkbox" data-ia-pw-opt="upper" checked> A-Z</label>
      <label><input type="checkbox" data-ia-pw-opt="lower" checked> a-z</label>
      <label><input type="checkbox" data-ia-pw-opt="digits" checked> 0-9</label>
      <label><input type="checkbox" data-ia-pw-opt="symbols" checked> !@#</label>
    </div>
    <p class="ia-hint">{% trans "Generated in your browser with a cryptographic RNG, never sent anywhere." %}</p>
  </div>
</section>
